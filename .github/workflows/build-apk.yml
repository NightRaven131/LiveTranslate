name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release yang mau di-build (kosongkan = release terbaru)'
        required: false
        type: string
      title:
        description: 'Override judul buat nama file APK (kosongkan = pakai judul asli release)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tentuin release yang mau di-build
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Gak nemu release sama sekali di repo ini."
            exit 1
          fi

          ACTUAL_TITLE=$(gh release view "$TAG" --repo "${{ github.repository }}" --json name -q .name)
          TITLE="${INPUT_TITLE:-$ACTUAL_TITLE}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Build buat release: $TAG ($TITLE)"

      - name: Download zip project dari release ini
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p source
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "LiveTranslate*.zip" \
            --dir source
          echo "File yang kedownload:"
          ls -la source

      - name: Extract zip
        run: |
          ZIP_FILE=$(find source -maxdepth 1 -iname "*.zip" | head -n1)
          mkdir -p source/extracted
          unzip -q "$ZIP_FILE" -d source/extracted

      - name: Cari root project Gradle
        id: proj
        run: |
          SETTINGS_FILE=$(find source/extracted -maxdepth 4 -iname "settings.gradle*" | head -n1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle(.kts) tidak ditemukan di dalam ZIP."
            exit 1
          fi
          echo "root=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK (debug, auto-signed)
        env:
          TAG: ${{ steps.release.outputs.tag }}
        working-directory: ${{ steps.proj.outputs.root }}
        run: |
          VERSION_NAME="${TAG#v}"
          gradle assembleDebug \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${{ github.run_number }}"

      - name: Rename APK sesuai tag & judul release
        id: apk
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          APK_PATH=$(find "${{ steps.proj.outputs.root }}" -iname "*.apk" -path "*debug*" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::File APK hasil build tidak ketemu."
            exit 1
          fi
          SAFE_TAG=$(echo "$TAG" | tr '/' '-')
          if [ -n "$TITLE" ]; then
            SAFE_TITLE=$(echo "$TITLE" | tr -cs '[:alnum:]' '_' | sed -E 's/^_+//; s/_+$//')
            OUT="LiveTranslate_${SAFE_TAG}_${SAFE_TITLE}.apk"
          else
            OUT="LiveTranslate_${SAFE_TAG}.apk"
          fi
          cp "$APK_PATH" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK ke release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Ringkasan
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          {
            echo "### ✅ APK berhasil dibuild & diupload ke release"
            echo "- Tag: \`$TAG\`"
            echo "- Judul: $TITLE"
            echo "- File: \`${{ steps.apk.outputs.path }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
