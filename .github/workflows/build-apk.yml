name: Build LiveTranslate APK from Release ZIP

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Release yang berisi LiveTranslate_GitHub_Build.zip (contoh: v1.0.0)'
        required: true
        type: string
      source_zip:
        description: 'Nama asset ZIP di Release'
        required: true
        default: 'LiveTranslate_GitHub_Build.zip'
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download source ZIP from Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_ZIP: ${{ inputs.source_zip }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/livetranslate"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ZIP" \
            --dir "$RUNNER_TEMP/livetranslate" \
            --clobber

          test -f "$RUNNER_TEMP/livetranslate/$SOURCE_ZIP"
          unzip -q "$RUNNER_TEMP/livetranslate/$SOURCE_ZIP" -d "$RUNNER_TEMP/livetranslate/extracted"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/livetranslate/extracted"
          PROJECT_DIR="$(find "$ROOT" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/LiveTranslate-${VERSION}.apk"

      - name: Upload APK to the same Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/LiveTranslate-${RELEASE_TAG#v}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload APK as workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-APK-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/LiveTranslate-*.apk
          if-no-files-found: error
          
