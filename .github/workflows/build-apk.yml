name: Build LiveTranslate APK from Release ZIP

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Release sumber, contoh: 1.0.0'
        required: true
        default: '1.0.0'
        type: string
      source_zip:
        description: 'Nama asset ZIP di Release'
        required: true
        default: 'LiveTranslate_GitHub_Build.zip'
        type: string

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Normalize workflow inputs
        id: inputs
        shell: bash
        env:
          RAW_TAG: ${{ inputs.release_tag }}
          RAW_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail

          # Menerima 1.0.0, v1.0.0, atau copy-paste "release_tag: v1.0.0".
          TAG="${RAW_TAG#release_tag:}"
          TAG="${TAG#tag:}"
          TAG="$(printf '%s' "$TAG" | xargs)"
          TAG="${TAG#v}"

          ZIP="${RAW_ZIP#source_zip:}"
          ZIP="$(printf '%s' "$ZIP" | xargs)"

          test -n "$TAG"
          test -n "$ZIP"

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_zip=$ZIP" >> "$GITHUB_OUTPUT"

          echo "Using release tag: $TAG"
          echo "Using source asset: $ZIP"

      - name: Verify source Release and asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          SOURCE_ZIP: ${{ steps.inputs.outputs.source_zip }}
        shell: bash
        run: |
          set -euo pipefail

          echo "--- Release ---"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

          echo "--- Assets ---"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name'

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fx "$SOURCE_ZIP"

      - name: Download source ZIP from Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          SOURCE_ZIP: ${{ steps.inputs.outputs.source_zip }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/livetranslate"
          mkdir -p "$ROOT/extracted"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ZIP" \
            --dir "$ROOT" \
            --clobber

          test -f "$ROOT/$SOURCE_ZIP"
          unzip -q "$ROOT/$SOURCE_ZIP" -d "$ROOT/extracted"

          echo "--- Extracted files ---"
          find "$ROOT/extracted" -maxdepth 4 -type f | sort | sed -n '1,120p'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/livetranslate/extracted"
          PROJECT_FILE="$(find "$ROOT" -type f -name settings.gradle.kts -print -quit)"

          test -n "$PROJECT_FILE"

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace --no-build-cache
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/LiveTranslate-${RELEASE_TAG}.apk"

      - name: Upload APK to the same Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/LiveTranslate-${RELEASE_TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload APK as workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-APK-${{ steps.inputs.outputs.release_tag }}
          path: ${{ runner.temp }}/LiveTranslate-*.apk
          if-no-files-found: error
