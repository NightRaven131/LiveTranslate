name: Build APK from Release Zip

on:
  release:
    types: [ created, published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag release yang berisi LiveTranslator.zip (kosongkan = pakai release terbaru)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tentukan tag release yang dipakai
        id: pick_tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG=$(gh release list --repo "$REPO" --limit 1 --json tagName -q '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Tidak ada release ditemukan. Buat GitHub Release dulu dan upload LiveTranslator.zip di situ sebagai asset."
            exit 1
          fi
          echo "Menggunakan release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download & extract LiveTranslator.zip dari release
        run: |
          mkdir -p source-zip project
          gh release download "${{ steps.pick_tag.outputs.tag }}" --repo "$REPO" --pattern "*.zip" --dir source-zip --clobber
          ZIP_FILE=$(find source-zip -maxdepth 1 -name "*.zip" | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Tidak menemukan file .zip di release ${{ steps.pick_tag.outputs.tag }}."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d project
          PROJECT_DIR=$(find project -maxdepth 4 -name settings.gradle -exec dirname {} \; | head -n1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Tidak menemukan settings.gradle di dalam zip."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Siapkan APK hasil build
        run: cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" LiveTranslator.apk

      - name: Upload APK sebagai artifact workflow
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslator-apk
          path: LiveTranslator.apk

      - name: Tempelkan APK ke release yang sama
        run: gh release upload "${{ steps.pick_tag.outputs.tag }}" LiveTranslator.apk --repo "$REPO" --clobber
